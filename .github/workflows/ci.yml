# 两个 job 的分工：`unit` 只装 requirements-fast.txt，几十秒跑完，任何提交都要绿；
# `slow` 装完整依赖（lightrag + onnxruntime）再跑 OCR 与大文件用例，只在手动触发或
# 每夜跑一次。分开的理由很简单：没人会为一个要等 6 分钟的检查去修红灯。

name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * *"   # 每天 03:00（UTC+8）

jobs:
  unit:
    name: 单元测试（不依赖 lightrag）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-fast.txt

      # 前端是免构建的 ES 模块，但仍然需要语法检查：
      # 拆模块之后最常见的错误是 import 路径写错，浏览器只会给一个 404。
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装最小依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-fast.txt

      - name: 单元测试（跳过标记为 slow 的用例）
        run: python -m pytest -q -m "not slow"

      # 依赖完整性必须单独跑一遍并且**在这里就失败**，而不是等到镜像构建时才发现。
      # 这条检查查的是"requirements.txt 有没有漏包"，它和单测同源但目的不同：
      # 单测证明代码逻辑对，它证明这套代码在干净环境里能被装起来。
      # 只装 requirements-fast.txt 时一部分包不在环境里，工具会把它们标成"无法判断"
      # 而不是"缺失"——见 tools/check_requirements.py 里 unknown 分支的注释。
      - name: 依赖完整性（requirements 是否覆盖所有 import）
        run: python -m tools.check_requirements

  slow:
    name: 完整依赖 + 慢测（OCR / PDF 版面）
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-ocr.txt

      - name: 安装完整依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock -r requirements-ocr.txt

      - name: 依赖完整性（完整依赖下的严格版）
        run: python -m tools.check_requirements

      # 这里跑**全量**而不是只跑 `-m slow`：test_answer_path.py 需要 lightrag 才能
      # import，在 unit job 里被 importorskip 跳过了。如果这个 job 也只跑 slow，
      # 那条用例就永远不会在 CI 里执行——"跳过的测试"和"没有的测试"是一回事。
      - name: 全量测试（含 slow 与需要 lightrag 的用例）
        run: python -m pytest -q
        env:
          # 指标与重排模型在测试里都是懒加载，这里只保证不会去连外网下载
          HF_HUB_OFFLINE: "0"

  # ---------------------------------------------------------------- 线上评测门禁
  # 为什么只在 push 到主干 / 手动触发时跑：这个 job 真的打线上模型，20 题约 ¥0.12。
  # 挂在每个 PR 的每次 commit 上，一是烧钱，二是 PR 期间模型还在改，门禁必然红——
  # 那种红只会训练人无视 CI。
  #
  # 为什么不需要 pip install：eval_platform 只用标准库（urllib / json / sqlite3），
  # 这样门禁不会因为"装依赖失败"而红，也不会拖慢 job。
  eval_gate:
    name: 线上可答率门禁（20 题，约 ¥0.12）
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 评测代码自己先过单测：判据错了，门禁的数字就没有意义。
      - name: 评测中台自检
        run: python -m unittest discover -s eval_platform/tests -t .

      - name: 采集 20 题（打线上 /v1/ask）
        env:
          DOCUMIND_KEY: ${{ secrets.DOCUMIND_KEY }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [ -n "${DOCUMIND_KEY:-}" ]; then EXTRA="--api-key $DOCUMIND_KEY"; fi
          python -m eval_platform run --suite documind \
            --tag "ci-${GITHUB_SHA:0:7}" --limit 20 --yes --quiet \
            --out eval_runs/ci-latest.json $EXTRA

      # 阈值按「掉几题」而不是 pp：20 题里只有 16 道可答题，2pp = 0.32 题，
      # 实际效果是"掉 1 题就红"（6.25pp），而同配置复跑的正常波动就是 0~2 题。
      # 所以宽容 2 题：掉 1 题放过、掉 2 题红。
      - name: 门禁（可答数掉满 2 题就失败）
        run: python -m eval_platform gate eval_runs/baseline.json eval_runs/ci-latest.json --max-drop-n 2

      # 失败也上传：红了以后第一件事是看"哪几题新错、新旧答案分别是什么"。
      - name: 上传本次 run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-run-${{ github.sha }}
          path: eval_runs/ci-latest.json
          if-no-files-found: warn
