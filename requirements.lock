# requirements.lock —— 锁定当前已验证可用的完整环境（Python 3.13）
#
# 这是本机（能跑通 128 个测试的那台）`pip freeze` 的产物，163 个包全部精确到 ==。
# 用途：换机器 / CI / Docker 构建时，用它代替 requirements.txt 直接复现同一个环境，
#       而不是"装最新版碰运气"——主版本号约束挡不住 minor 版本里引入的破坏性变更。
#
# 为什么不用 pip-compile / pip-tools：
#   1. 这台机器的 pip 会静默挂起（零输出、不退出），pip-compile 依赖 pip 解析，跑不动；
#   2. requirements.txt 里 9 个直接依赖本身已是 == 精确约束，缺的是"传递依赖"这层，
#      freeze 恰好能补上它。
#
# 与 requirements.txt 的分工：
#   requirements.txt     —— 人读的、带注释的意图声明（9 个直接依赖）
#   requirements.lock    —— 机器读的、全量精确锁定（含传递依赖，163 个）
#   两者缺一不可：只留 lock 会丢失"为什么要这些包"的注释，只留 txt 会丢失版本可复现性。
#
# 复现方式：
#   python -m venv .venv
#   .venv/Scripts/python.exe -m pip install -r requirements.lock
#
# 注意：本 lock 是"运行时 + 测试"合并锁。OCR(docling/torch) 是可选依赖，本机未装，
#       因此不在其中——需要 OCR/更强版面解析时，在 lock 之后追加 requirements-ocr.txt。

